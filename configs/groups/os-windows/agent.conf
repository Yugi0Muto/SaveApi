<agent_config os="Windows">
  <syscheck>
    <directories check_all="yes" realtime="yes">%WINDIR%\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\StartUp</directories>
    <directories check_all="yes">%WINDIR%\System32\Tasks</directories>
    <windows_registry>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
  </syscheck>
  <!-- Événements du journal Sécurité collectés (règles Wazuh + règles du bundle 100520-100524) :
       4624/4625 ouverture/échec de session   4648 identifiants explicites   4688 nouveau processus (*)
       4720 compte créé   4728/4732/4756 ajout à un groupe (règle 100521)   4698 tâche planifiée créée (*) (100523)
       4719 politique d'audit modifiée (100524)   1102 journal Sécurité effacé (100520)
       (*) nécessitent l'activation de l'audit correspondant par GPO (« Création du processus »,
           « Autres événements d'accès aux objets »). -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
    <query>Event/System[EventID=4624 or EventID=4625 or EventID=4648 or EventID=4688 or EventID=4720 or EventID=4728 or EventID=4732 or EventID=4756 or EventID=4698 or EventID=4719 or EventID=1102]</query>
  </localfile>
  <!-- Journal Système complet : nouveaux services (7045, règle 100522), journal effacé (104, règle 100520) -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>System</location>
  </localfile>
  <!-- Windows Defender : détections (règle 100540) et désactivation de la protection (règle 100541) -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
  </localfile>
</agent_config>
