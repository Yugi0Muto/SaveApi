<!-- Groupe os-linux : surveillance de base de toute machine Linux.
     FIM (contrôle d'intégrité) : alerte quand un fichier surveillé est ajouté, modifié ou supprimé.
       realtime="yes"       : détection immédiate (inotify) ; sinon au contrôle périodique (groupe seg-*).
       report_changes="yes" : l'alerte montre le contenu modifié (diff) ; désactivé pour les fichiers
                              contenant des secrets (nodiff).
     Règles du bundle associées : 100551 à 100556 (docs/REGLES.md). -->
<agent_config os="Linux">
  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <!-- Tâches cron des utilisateurs (règle 100553) -->
    <directories check_all="yes" realtime="yes">/var/spool/cron</directories>
    <!-- Clés SSH autorisées (règle 100551) : uniquement les fichiers authorized_keys -->
    <directories check_all="yes" realtime="yes" report_changes="yes" restrict="authorized_keys">/root/.ssh</directories>
    <directories check_all="yes" restrict="authorized_keys">/home</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore type="sregex">\.swp$|~$</ignore>
    <!-- Ne jamais copier le contenu de ces fichiers dans les alertes (empreintes de mots de passe, clés) -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
    <nodiff type="sregex">^/etc/ssl/private/|\.key$</nodiff>
  </syscheck>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>
</agent_config>
